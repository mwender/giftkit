<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="GiftKit">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{site_url}}/assets/images/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="GiftKit: Donation form? Already built. A sample donation form with a monthly gift of $51.50.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{og_title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{site_url}}/assets/images/og-image.png">
<meta name="twitter:image:alt" content="GiftKit: Donation form? Already built. A sample donation form with a monthly gift of $51.50.">
<link rel="icon" href="{{root}}assets/images/icon.svg" type="image/svg+xml">
<link rel="preload" href="{{root}}assets/fonts/familjen-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{root}}assets/site.css">
</head>
<body>
<header class="site-header">
	<div class="wrap">
		<a class="brand" href="{{root}}"><img src="{{root}}assets/images/icon.svg" alt="" width="36" height="36">GiftKit</a>
		<nav class="site-nav" aria-label="Site">
			<a href="{{root}}docs/"{{docs_current}}>Docs</a>
			<a href="{{root}}changelog/"{{changelog_current}}>Changelog</a>
			<a href="https://github.com/mwender/giftkit">GitHub</a>
		</nav>
	</div>
</header>
<main id="main">
{{content}}
</main>
<footer class="site-footer">
	<div class="wrap">
		<p>GiftKit for Gravity Forms is free software, licensed under the GPL.</p>
		<p>Made by <a href="https://mwender.com/">Michael Wender</a>.</p>
	</div>
</footer>
{{scripts}}
</body>
</html>
