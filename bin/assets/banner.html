<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GiftKit banner</title>
<!--
  Source for .wordpress-org/banner-772x250.png and banner-1544x500.png.
  Render with: node bin/render-assets.js
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 772px; height: 250px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    color: #1d2140;
    background:
      radial-gradient(circle at 92% 8%, #ffd2cc 0, rgba(255, 210, 204, 0) 42%),
      radial-gradient(circle at 60% 120%, #ffe7c9 0, rgba(255, 231, 201, 0) 45%),
      linear-gradient(120deg, #fff8f3 0%, #ffece6 100%);
  }

  /* Left: mark, name, tagline, features. */
  .brand { position: absolute; left: 44px; top: 34px; width: 330px; }
  .brand-row { display: flex; align-items: center; gap: 14px; }
  .brand-row img { width: 58px; height: 58px; border-radius: 14px; box-shadow: 0 6px 16px rgba(229, 72, 77, 0.35); }
  .name { font-size: 46px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
  .tagline { margin-top: 14px; font-size: 18px; line-height: 1.3; color: #3b4166; }
  .tagline strong { color: #1d2140; font-weight: 600; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .pill { padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.8); border: 1px solid #f3c6c2; font-size: 12px; font-weight: 600; color: #b3262c; }

  /* Right: page 1 of the form, tilted. */
  .stage { position: absolute; left: 400px; top: 12px; perspective: 1100px; }
  .card {
    width: 380px; padding: 18px 20px 20px;
    background: #fff; border-radius: 16px;
    box-shadow: 0 24px 50px rgba(29, 33, 64, 0.18), 0 4px 10px rgba(29, 33, 64, 0.08);
    transform: rotateY(-16deg) rotateX(8deg) rotateZ(-2deg);
    transform-origin: left center;
  }
  .dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; }
  .dots span { width: 8px; height: 8px; border-radius: 50%; border: 2px solid #e5484d; }
  .dots span:first-child { background: #e5484d; }
  .toggle { display: grid; grid-template-columns: 1fr 1fr; border-radius: 9px; overflow: hidden; margin-bottom: 12px; }
  .toggle div { padding: 10px 0; text-align: center; font-size: 14px; font-weight: 600; background: #f1f1f3; color: #6b6f80; }
  .toggle .on { background: #e5484d; color: #fff; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .tiles div { padding: 9px 0; text-align: center; border-radius: 8px; background: #f1f1f3; color: #6b6f80; font-size: 14px; }
  .tiles .on { background: #e5484d; color: #fff; font-weight: 700; }
  .bottom { display: flex; align-items: flex-end; gap: 14px; }
  .amount { flex: 1; display: flex; align-items: baseline; gap: 4px; border-bottom: 2px solid #c9cbd4; padding-bottom: 2px; }
  .amount b { font-size: 34px; font-weight: 600; line-height: 1; }
  .amount i { margin-left: auto; font-style: normal; font-size: 11px; color: #6b6f80; }
  .button { padding: 11px 22px; border-radius: 9px; background: #e5484d; color: #fff; font-size: 15px; font-weight: 700; }
</style>
</head>
<body>
  <div class="brand">
    <div class="brand-row">
      <img src="../../.wordpress-org/icon.svg" alt="">
      <div class="name">GiftKit</div>
    </div>
    <p class="tagline">Ready-made donation forms<br>for <strong>Gravity Forms</strong></p>
    <div class="pills">
      <span class="pill">One-time &amp; monthly</span>
      <span class="pill">Stripe</span>
      <span class="pill">Cover the fee</span>
    </div>
  </div>

  <div class="stage">
    <div class="card">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="toggle"><div class="on">One Time Gift</div><div>Monthly Gift</div></div>
      <div class="tiles">
        <div>$25</div><div class="on">$50</div><div>$100</div><div>$250</div>
        <div>$500</div><div>$1,000</div><div>$2,500</div><div>Other</div>
      </div>
      <div class="bottom">
        <div class="amount"><b>$50</b><i>USD</i></div>
        <div class="button">Continue</div>
      </div>
    </div>
  </div>
</body>
</html>
