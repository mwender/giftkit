<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GiftKit banner</title>
<!--
  Source for .wordpress-org/banner-772x250.png and banner-1544x500.png.
  Render with: node bin/render-assets.js
-->
<style>
  @font-face { font-family: "Bricolage Grotesque"; src: url("../../site/assets/fonts/bricolage-grotesque.woff2") format("woff2"); font-weight: 400 800; }
  @font-face { font-family: "Source Sans 3"; src: url("../../site/assets/fonts/source-sans-3.woff2") format("woff2"); font-weight: 400 700; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 772px; height: 250px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
    color: #1d2140;
    background: #f6f7fb;
  }

  /* Left: mark, name, tagline, features. */
  .brand { position: absolute; left: 44px; top: 34px; width: 330px; }
  .brand-row { display: flex; align-items: center; gap: 14px; }
  .brand-row img { width: 58px; height: 58px; border-radius: 14px; box-shadow: 0 6px 16px rgba(229, 72, 77, 0.35); }
  .name { font-family: "Bricolage Grotesque", sans-serif; font-size: 50px; font-weight: 760; letter-spacing: -1.5px; line-height: 1; }
  .tagline { margin-top: 14px; font-family: "Bricolage Grotesque", sans-serif; font-size: 21px; font-weight: 600; line-height: 1.15; letter-spacing: -0.3px; color: #1d2140; }
  .tagline strong { font-weight: 600; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .pill { padding: 4px 10px; border-radius: 999px; background: #fff; border: 1px solid #dcdfea; font-size: 13px; font-weight: 600; color: #5b6178; }

  /* Right: page 1 of the form, tilted. */
  .stage { position: absolute; left: 400px; top: 12px; perspective: 1100px; }
  .card {
    width: 380px; padding: 18px 20px 20px;
    background: #fff; border-radius: 16px;
    box-shadow: 0 1px 0 #dcdfea, 0 30px 50px -24px rgba(29, 33, 64, 0.4);
    transform: rotateY(-16deg) rotateX(8deg) rotateZ(-2deg);
    transform-origin: left center;
  }
  .dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; }
  .dots span { width: 8px; height: 8px; border-radius: 50%; border: 2px solid #d23a40; }
  .dots span:first-child { background: #d23a40; }
  .toggle { display: grid; grid-template-columns: 1fr 1fr; border-radius: 9px; overflow: hidden; margin-bottom: 12px; }
  .toggle div { padding: 10px 0; text-align: center; font-family: "Bricolage Grotesque", sans-serif; font-size: 15px; font-weight: 600; background: #eceef4; color: #5b6178; }
  .toggle .on { background: #d23a40; color: #fff; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .tiles div { padding: 9px 0; text-align: center; border-radius: 8px; background: #eceef4; color: #5b6178; font-family: "Bricolage Grotesque", sans-serif; font-size: 15px; font-weight: 600; }
  .tiles .on { background: #d23a40; color: #fff; }
  .bottom { display: flex; align-items: flex-end; gap: 14px; }
  .amount { flex: 1; display: flex; align-items: baseline; gap: 4px; border-bottom: 2px solid #dcdfea; padding-bottom: 2px; }
  .amount b { font-family: "Bricolage Grotesque", sans-serif; font-size: 36px; font-weight: 700; line-height: 1; letter-spacing: -0.5px; }
  .amount i { margin-left: auto; font-style: normal; font-size: 12px; color: #5b6178; }
  .button { padding: 11px 22px; border-radius: 9px; background: #1d2140; color: #fff; font-size: 15px; font-weight: 700; }
</style>
</head>
<body>
  <div class="brand">
    <div class="brand-row">
      <img src="../../.wordpress-org/icon.svg" alt="">
      <div class="name">GiftKit</div>
    </div>
    <p class="tagline">Ready-made donation forms<br>for <strong>Gravity Forms</strong></p>
    <div class="pills">
      <span class="pill">One-time &amp; monthly</span>
      <span class="pill">Stripe</span>
      <span class="pill">Cover the fee</span>
    </div>
  </div>

  <div class="stage">
    <div class="card">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="toggle"><div class="on">One Time Gift</div><div>Monthly Gift</div></div>
      <div class="tiles">
        <div>$25</div><div class="on">$50</div><div>$100</div><div>$250</div>
        <div>$500</div><div>$1,000</div><div>$2,500</div><div>Other</div>
      </div>
      <div class="bottom">
        <div class="amount"><b>$50</b><i>USD</i></div>
        <div class="button">Continue</div>
      </div>
    </div>
  </div>
</body>
</html>
