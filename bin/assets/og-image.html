<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GiftKit social image</title>
<!--
  Source for site/assets/images/og-image.png (1200x630), the image shown
  when giftkit.org is shared. Render with: npm run assets
-->
<style>
  @font-face { font-family: "Familjen Grotesk"; src: url("../../site/assets/fonts/familjen-grotesk.woff2") format("woff2"); font-weight: 400 700; }
  @font-face { font-family: "Source Sans 3"; src: url("../../site/assets/fonts/source-sans-3.woff2") format("woff2"); font-weight: 400 700; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #f6f7fb; color: #1d2140; font-family: "Source Sans 3", sans-serif; }

  .copy { position: absolute; left: 72px; top: 70px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 64px; height: 64px; border-radius: 15px; }
  .brand span { font-family: "Familjen Grotesk", sans-serif; font-size: 44px; font-weight: 700; letter-spacing: -0.5px; }
  h1 { margin-top: 64px; font-family: "Familjen Grotesk", sans-serif; font-size: 78px; font-weight: 700; line-height: 1; letter-spacing: -1.6px; }
  h1 span { display: block; white-space: nowrap; }
  p { margin-top: 28px; font-size: 28px; line-height: 1.3; color: #5b6178; }
  .domain { position: absolute; left: 72px; bottom: 56px; font-size: 24px; font-weight: 600; color: #5b6178; }

  .stage { position: absolute; left: 700px; top: 96px; perspective: 1300px; }
  .card {
    width: 470px; padding: 26px;
    background: #fff; border-radius: 22px;
    box-shadow: 0 1px 0 #dcdfea, 0 40px 70px -30px rgba(29, 33, 64, 0.45);
    transform: rotateY(-14deg) rotateX(6deg) rotateZ(-2deg);
    transform-origin: left center;
  }
  .toggle { display: grid; grid-template-columns: 1fr 1fr; border-radius: 12px; overflow: hidden; }
  .toggle div, .tiles div { font-family: "Familjen Grotesk", sans-serif; font-weight: 600; text-align: center; background: #eceef4; color: #5b6178; }
  .toggle div { padding: 16px 0; font-size: 22px; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
  .tiles div { padding: 14px 0; border-radius: 10px; font-size: 21px; }
  .on { background: #d23a40 !important; color: #fff !important; }
  .fee { display: flex; align-items: center; gap: 10px; margin-top: 20px; font-size: 19px; }
  .fee i { display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 4px; background: #d23a40; color: #fff; font-style: normal; font-size: 15px; font-weight: 700; line-height: 1; }
  .total { margin-top: 18px; padding-top: 14px; border-top: 2px solid #dcdfea; }
  .note { font-size: 19px; font-weight: 700; color: #d23a40; }
  .sum { display: flex; align-items: baseline; justify-content: space-between; }
  .sum b { font-family: "Familjen Grotesk", sans-serif; font-size: 62px; line-height: 1.05; letter-spacing: -1px; }
  .sum span { font-size: 18px; color: #5b6178; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../.wordpress-org/icon.svg" alt=""><span>GiftKit</span></div>
    <h1><span>Donation form?</span><span>Already built.</span></h1>
    <p>A complete donation form for Gravity Forms, with Stripe payments.</p>
  </div>
  <div class="domain">giftkit.org</div>

  <div class="stage">
    <div class="card">
      <div class="toggle"><div>One time</div><div class="on">Monthly</div></div>
      <div class="tiles"><div>$25</div><div class="on">$50</div><div>$100</div><div>$250</div></div>
      <div class="fee"><i>&#10003;</i>Add 3% to cover our transaction costs</div>
      <div class="total">
        <div class="note">Monthly gift, charged every month</div>
        <div class="sum"><b>$51.50</b><span>USD / month</span></div>
      </div>
    </div>
  </div>
</body>
</html>
