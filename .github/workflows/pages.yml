name: Publish the website

# Builds the landing page and docs (bin/build-site.js) and publishes them to
# GitHub Pages. The repository's Pages source must be "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'assets/images/**'
      - '.wordpress-org/icon.svg'
      - 'bin/build-site.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
